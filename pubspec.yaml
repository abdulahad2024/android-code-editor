name: android_code_editor
description: "CodeVerse - Advanced All-in-One Programming IDE & Practice App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  google_fonts: ^6.2.1
  flutter_highlight: ^0.7.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.19.0
  webview_flutter: ^4.8.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sample_projects/
    - assets/lessons/
